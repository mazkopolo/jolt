<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jolt — Cast Receiver</title>

<!--
  Jolt's Chromecast receiver.

  The phone does not mirror its screen; it sends a small JSON frame about once a second and
  this page draws the clock itself. Sharper on a TV, far lower latency, and the phone is
  free to go in a pocket.

  Host this at a stable HTTPS URL (GitHub Pages is fine), then register it as a **Custom
  Receiver** in the Google Cast Developer Console and put the resulting application ID into
  the app's res/values/cast.xml.

  Sizing is in `vmin` throughout so it fills a 1080p TV and a 4K one identically.
-->

<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

<style>
  :root {
    --bg: #0A0E14;
    --text: #F3F6FB;
    --dim: #98A2B3;
    --volt: #B6FF3A;
    --cyan: #29D3FF;
    --amber: #FF9E1B;
    --magenta: #FF4D8D;
    --phase: var(--volt);
  }
  @font-face {
    font-family: 'Saira Condensed';
    src: url('SairaCondensed-Black.ttf') format('truetype');
    font-weight: 900;
    font-display: swap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Saira Condensed', 'Arial Narrow', system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    /* TVs overscan. Nothing important goes in the outer 5%. */
    padding: 5vmin;
  }

  /* The phase wash, the same idea as the app's big-screen mode. */
  #stage {
    position: fixed; inset: 0;
    background: color-mix(in srgb, var(--phase) 18%, transparent);
    transition: background 400ms ease;
  }
  #content { position: relative; width: 100%; height: 100%;
             display: flex; flex-direction: column; }

  #phase {
    color: var(--phase);
    font-size: 7vmin; font-weight: 900;
    letter-spacing: 0.8vmin; text-align: center;
    text-transform: uppercase;
  }

  #middle { flex: 1; display: flex; align-items: center; gap: 4vmin; min-height: 0; }
  #clock {
    font-size: 34vmin; font-weight: 900; line-height: 0.84;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  /* Rest prints the clock in amber: the colour is the phase signal. */
  body[data-phase="rest"] #clock { color: var(--amber); }

  #moves { flex: 1; display: flex; flex-direction: column; justify-content: center;
           gap: 1.4vmin; min-width: 0; }
  .move { font-size: 6vmin; font-weight: 900; line-height: 1;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .move b { color: var(--phase); margin-right: 1.2vmin; }
  #nextup { color: var(--dim); font-size: 2.6vmin; letter-spacing: 0.5vmin; }

  #stats { display: flex; justify-content: center; gap: 7vmin; }
  .stat { text-align: center; }
  .stat .v { font-size: 6vmin; font-weight: 900; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 1.8vmin; color: var(--dim); letter-spacing: 0.4vmin; }

  /* Idle and finished states, so the TV is never just a black rectangle. */
  #idle { position: fixed; inset: 0; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 2vmin; background: var(--bg); }
  #idle h1 { font-size: 12vmin; font-weight: 900; letter-spacing: 1vmin; color: var(--volt); }
  #idle p { font-size: 3vmin; color: var(--dim); font-family: system-ui, sans-serif; }
  [hidden] { display: none !important; }
</style>
</head>

<body data-phase="work">
  <div id="stage"></div>

  <div id="content" hidden>
    <div id="phase">WORK</div>
    <div id="middle">
      <div id="clock">0:00</div>
      <div id="moves"><div id="nextup" hidden>NEXT UP</div></div>
    </div>
    <div id="stats"></div>
  </div>

  <div id="idle">
    <h1>JOLT</h1>
    <p id="idleText">Ready — start a workout on your phone</p>
  </div>

<script>
  const PHASE_COLOR = {
    prep: 'var(--cyan)', work: 'var(--volt)',
    rest: 'var(--amber)', maxeffort: 'var(--magenta)',
  };

  const el = {
    body: document.body,
    content: document.getElementById('content'),
    idle: document.getElementById('idle'),
    idleText: document.getElementById('idleText'),
    phase: document.getElementById('phase'),
    clock: document.getElementById('clock'),
    moves: document.getElementById('moves'),
    nextup: document.getElementById('nextup'),
    stats: document.getElementById('stats'),
  };

  function render(d) {
    el.idle.hidden = true;
    el.content.hidden = false;

    const phase = (d.phase || 'work').toLowerCase();
    el.body.dataset.phase = phase;
    document.documentElement.style.setProperty('--phase', PHASE_COLOR[phase] || 'var(--volt)');

    el.phase.textContent = d.phaseTitle || '';
    el.clock.textContent = d.clock || '0:00';

    // A rest shows the *coming* round, so say so — otherwise it reads as instructions
    // for the rest itself.
    const isRest = phase === 'rest';
    el.nextup.hidden = !isRest;

    el.moves.querySelectorAll('.move').forEach(n => n.remove());
    (d.movements || []).forEach(m => {
      const row = document.createElement('div');
      row.className = 'move';
      row.innerHTML = (m.reps ? '<b>' + m.reps + '</b>' : '') +
                      String(m.name).toUpperCase();
      el.moves.appendChild(row);
    });
    // With no movements the clock takes the whole width rather than sitting off-centre.
    el.moves.hidden = !(d.movements || []).length && !isRest;
    el.clock.style.flex = el.moves.hidden ? '1' : '0 0 auto';
    el.clock.style.textAlign = el.moves.hidden ? 'center' : 'left';

    const stats = [];
    if (d.round && d.totalRounds) stats.push(['ROUND', d.round + '/' + d.totalRounds]);
    if (d.reps) stats.push(['REPS', d.reps]);
    if (d.elapsed) stats.push(['ELAPSED', d.elapsed]);
    if (d.remaining) stats.push(['LEFT', d.remaining]);
    el.stats.innerHTML = stats.map(([l, v]) =>
      '<div class="stat"><div class="v">' + v + '</div><div class="l">' + l + '</div></div>'
    ).join('');
  }

  function finished(d) {
    el.content.hidden = true;
    el.idle.hidden = false;
    el.idleText.textContent = (d.name ? d.name + ' — ' : '') + 'great work.';
  }

  const ctx = cast.framework.CastReceiverContext.getInstance();
  ctx.addCustomMessageListener('urn:x-cast:com.joltapp.jolt', event => {
    const d = event.data && typeof event.data === 'string'
      ? JSON.parse(event.data) : event.data;
    if (!d) return;
    if (d.type === 'finished') finished(d); else render(d);
  });

  // A gym timer must not vanish because nobody touched anything for five minutes.
  const opts = new cast.framework.CastReceiverOptions();
  opts.disableIdleTimeout = true;
  opts.maxInactivity = 3600;
  ctx.start(opts);
</script>
</body>
</html>
